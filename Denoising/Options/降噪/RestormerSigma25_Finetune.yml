# general settings
name: GaussianGrayDenoising_RestormerSigma25_Finetune
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_GaussianDenoising
    sigma_type: constant
    sigma_range: 25
    in_ch: 1
    dataroot_gt: Denoising/Datasets/train/XRAY  # 您的20张图放在这里
    dataroot_lq: none
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1  # 图像较大，减少batch size
    gt_size: 512  # 使用更大的patch size以利用您的较大图像
    gt_sizes: [128, 256, 384, 512]  # 渐进式patch size
    mini_batch_sizes: [2, 1, 1, 1]  # 对应每个阶段的batch size
    iters: [5000, 10000, 10000, 5000]  # 每个阶段的迭代次数，总计30000
    dataset_enlarge_ratio: 20  # 适度增加扩充比例
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_GaussianDenoising
    sigma_test: 25
    in_ch: 1
    dataroot_gt: Z:\14-调试数据\lxm\Dataset\DeNoise_Datasets\test\BSD68
    dataroot_lq: none
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: BiasFree
  dual_pixel_task: False

# path - 使用预训练模型进行微调
path:
  pretrain_network_g: ./Denoising/pretrained_models/gaussian_gray_denoising_blind.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 30000  # 减少迭代次数
  warmup_iter: 500
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [10000, 20000]
    restart_weights: [1, 1]
    eta_mins: [0.00001, 0.000001]
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 1e-5  # 使用很小的学习率进行微调
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 500
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 2
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 50
  save_checkpoint_freq: !!float 1000
  use_tb_logger: false
  wandb:
    project: null
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
