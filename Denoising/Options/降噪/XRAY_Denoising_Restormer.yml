# 训练配置 - X-RAY 焊缝图像去噪
# 使用合成数据训练，可适配自定义噪声分布

name: XRAY_Denoising_Restormer
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # 根据你的GPU数量调整
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_GaussianDenoising
    sigma_type: random  # 随机噪声级别
    sigma_range: [0, 50]  # 噪声范围
    in_ch: 1  # 灰度图像

    # 你的训练数据路径
    dataroot_gt: Z:\14-调试数据\lxm\Dataset\DeNoise_Datasets\train\DFWB
    dataroot_lq: none

    geometric_augs: true  # 数据增强

    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 4

    # 渐进式训练设置
    mini_batch_sizes: [4, 2, 1]
    iters: [50000, 30000, 20000]
    gt_size: 256
    gt_sizes: [128, 192, 256]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_GaussianDenoising
    sigma_test: 25
    in_ch: 1
    dataroot_gt: Z:\14-调试数据\lxm\Dataset\DeNoise_Datasets\val
    dataroot_lq: none
    io_backend:
      type: disk

network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false

path:
  pretrain_network_g: ./Denoising/pretrained_models/gaussian_gray_denoising_blind.pth
  strict_load_g: false
  resume_state: ~

# training settings
train:
  total_iter: 100000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # Split 300k iterations into two cycles. 
  # 1st cycle: fixed 3e-4 LR for 92k iters. 
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 208k iters.
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [50000, 50000]       
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]   
  
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: false
  wandb:
    project: null
    resume_id: ~

validation:
  freq: 5000
  save_img: true

  datasets:
    val_1:
      name: Val1
      type: Dataset_GaussianDenoising
      sigma_test: 15
      in_ch: 1
      dataroot_gt: Z:\14-调试数据\lxm\Dataset\DeNoise_Datasets\test
      io_backend:
        type: disk

# val settings (for validation during training)
val:
  window_size: 8
  val_freq: !!float 5e3
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
